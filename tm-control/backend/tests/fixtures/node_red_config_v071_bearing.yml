thingsboard:
    enabled: false
    host: tb.server.com
    protocol: https
    # port: 443
    access_token:

deployment:
    lat: 45.0
    lon: -122.0
    bearing: 's'

sensors:
    cameras:
        picam_h265:
            enabled: true
            camera_radar: TM_RADAR_SERIAL_PORT_00
            deployment:
                lat: 45.1
                lon: -122.1
                bearing: 'e'

    radars:
        TM_RADAR_SERIAL_PORT_00:
            enabled: true
            opt_api_commands_array: '["^/+0.00\n", "^/-0.00\n"]'
            deployment:
                bearing: sideways

    airquality_monitors:
        sensorname01:
            enabled: false
            mqtt_topic_incoming: readings

time:
    timezone: America/Los_Angeles
    npt_set: true
