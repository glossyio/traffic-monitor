thingsboard:
    enabled: false
    host: tb.server.com
    protocol: https
    # port: 443
    access_token: 

deployment:
    lat: 
    lon: 
    bearing: ''
    survey_id:  # names the place the device is used at (see the setup guide); a change here starts a new deployment
    database_precision: '1'  # none, 1, or 2 decimal places stored in the database

sensors:
    cameras:
        picam_h265:
            enabled: true
            camera_radar: TM_RADAR_SERIAL_PORT_00

    radars:
        TM_RADAR_SERIAL_PORT_00:
            enabled: true
            opt_api_commands_array: '["^/+0.00\n", "^/-0.00\n"]'

    airquality_monitors:
        sensorname01:
            enabled: false
            mqtt_topic_incoming: readings
