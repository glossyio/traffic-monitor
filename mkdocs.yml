# Docs site for docs.trafficmonitor.ai, built with Material for MkDocs and
# versioned with mike. See docs/development/contributing.md#writing-docs.
site_name: Traffic Monitor
site_description: Open-source roadway counting and speed monitoring on a Raspberry Pi
site_url: https://docs.trafficmonitor.ai/
repo_url: https://github.com/glossyio/traffic-monitor
repo_name: glossyio/traffic-monitor
edit_uri: edit/dev/docs/

theme:
  name: material
  custom_dir: docs-site/overrides
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  version:
    provider: mike
    default: latest
    alias: true

plugins:
  - search
  # Writes llms.txt and llms-full.txt (https://llmstxt.org/) for AI tools.
  # The sections mirror the nav below. A page in a listed folder is picked up
  # automatically; a page outside those folders must be listed here by name.
  - llmstxt:
      # Links must include the version folder. The docs workflow sets
      # TM_DOCS_BASE_URL for each version it deploys.
      base_url: !ENV [TM_DOCS_BASE_URL, "https://docs.trafficmonitor.ai/latest/"]
      full_output: llms-full.txt
      markdown_description: >-
        The Traffic Monitor turns a Raspberry Pi 5 with a camera, Doppler
        radar, and an optional AI accelerator into an open source roadway
        counter and speed monitor. These docs cover hardware, installation,
        setup, configuration, the on-device dashboards, and data payloads.
      sections:
        Get started:
          - README.md
          - get-started/*.md
          - getting-started.md
        Build your own:
          - build-your-own-device-diy/*.md
          - software-installation.md
        Deploy:
          - deployment-and-mounting-guide.md
          - setup-guide.md
        Use the device:
          - use/*.md
          - ui/*.md
          - configuration/frigate-config.md
        Reference:
          - configuration/node-red-config.md
          - configuration/environment.md
          - reference/*.md
          - data-and-payloads/*.md
        Add-ons:
          - add-ons/*.md
        Help:
          - help-and-faq/*.md
        Development:
          - development/*.md
  - mike:
      # Copy the release to /latest/ rather than symlinking it, so it doesn't
      # depend on the host following symlinks.
      alias_type: copy
      canonical_version: latest

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

# With `mkdocs build --strict`, these warnings fail the build.
validation:
  omitted_files: warn
  unrecognized_links: warn
  anchors: warn

# Sections are named for what the reader is doing, not for the component.
# Keep file paths stable when you move a page in the nav; a path that does
# change needs a row in the "moved" map in docs-site/pages-root/404.html.
nav:
  - Home: README.md
  - Get started:
      - How it works: get-started/how-it-works.md
      - Choose your path: getting-started.md
  - Build your own:
      - build-your-own-device-diy/README.md
      - Hardware: build-your-own-device-diy/recommended-hardware.md
      - Assembly: build-your-own-device-diy/assembly-instructions.md
      - Install the software: software-installation.md
      - Update the software: build-your-own-device-diy/update.md
  - Deploy:
      - Choose a site and mount: deployment-and-mounting-guide.md
      - First-time setup: setup-guide.md
  - Use the device:
      - Home page and apps: use/home-page.md
      - Dashboards:
          - Monitoring: ui/monitoring.md
          - Movements: ui/movements.md
          - Data export: ui/database.md
      - Tune object detection: configuration/frigate-config.md
      - System administration: use/system-admin.md
  - Reference:
      - config.yml settings: configuration/node-red-config.md
      - node-red-tm.env settings: configuration/environment.md
      - Installer options: reference/tmsetup.md
      - Data:
          - Data and privacy: data-and-payloads/data-overview.md
          - Events: data-and-payloads/events-payload.md
          - Radar: data-and-payloads/radar-payload.md
          - Air quality: data-and-payloads/air-quality-aq-payload.md
          - MQTT and ThingsBoard: data-and-payloads/integrations.md
  - Add-ons:
      - Air quality sensor: add-ons/air-quality.md
      - Plate Recognizer: add-ons/plate-recognizer.md
  - Ideas and use cases: help-and-faq/use-cases-and-scenarios.md
  - Help:
      - Troubleshooting and FAQ: help-and-faq/frequently-asked-questions.md
      - Get support: help-and-faq/where-can-i-get-support.md
  - Development:
      - Dev environment: development/dev-environment.md
      - Contributing and writing docs: development/contributing.md
