# Runs the off-device checks from CONTRIBUTING.md on every pull request and on
# each push to dev:
#   - python: the pytest suites (schema, installer, tm-control, run against
#     tm-control's locked packages), the Ansible (setup and update prepare),
#     Jinja, flows.json, tmsetup.sh, and tm-update syntax checks, and the
#     checks of the two Python locks
#     (installable, consistent, and a wheel for the device's 64-bit Arm Python)
#   - ui: tm-control's UI build (with its type check) and Vitest tests, on the
#     Node version the device builds it with
#   - dependency-review (pull requests only): fails when the pull request adds
#     or changes a runtime dependency to a version with a known high or
#     critical vulnerability
# Device tests (script/devpi/tests) need a bench Pi and don't run here.
name: Tests

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # A new push to a pull request replaces its running checks; every push to
  # dev is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the device's Node version
        id: node
        run: |
          v=$(grep -oP '^tmsetup_node_image:.*/node:\K[0-9]+\.[0-9]+\.[0-9]+' script/ansible/roles/tmsetup/vars/main.yml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # The Raspberry Pi OS release the device runs (Debian 13) has Python 3.13.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            script/requirements
            script/requirements.lock
            script/requirements-dev
            tm-control/backend/requirements.txt
            tm-control/backend/requirements.lock
      # The flows and settings.js tests run JavaScript with node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      # tm-control's packages first, from the lock a device installs, so the
      # suites run against what the device runs. The dev list then adds the
      # test tools and finds these pins already met.
      - name: Install tm-control's locked packages
        run: pip install --require-hashes -r tm-control/backend/requirements.lock
      - run: pip install -r script/requirements-dev

      - name: Tests
        # A test that needs a missing tool (Podman, node, git, ...) fails here
        # instead of skipping (script/tests/required_tools.py).
        env:
          TM_TESTS_REQUIRE_TOOLS: "1"
        run: python -m pytest -rs container/node-red-tm/schema/tests script/tests tm-control/backend/tests
      - name: Ansible syntax
        working-directory: script/ansible
        run: |
          ansible-playbook -i localhost setup.yml --syntax-check </dev/null
          ansible-playbook -i localhost update_prepare.yml --syntax-check </dev/null
      - name: Jinja templates parse
        run: python -c 'import sys,jinja2; e=jinja2.Environment(); [e.parse(open(f).read(), filename=f) for f in sys.argv[1:]]' $(git ls-files '*.j2')
      - name: flows.json is valid JSON
        run: python -m json.tool container/node-red-tm/data/flows.json >/dev/null
      - name: tmsetup.sh syntax
        run: bash -n script/tmsetup.sh
      # tm-update imports only the standard library, and the device runs it
      # with -EP, so this runs it the same way.
      - name: tm-update starts
        run: python3 -EP script/tm-update --help
      # The installer's Ansible, from its lock into a throwaway venv, as
      # tmsetup.sh installs it.
      - name: Ansible lock installs and is consistent
        run: |
          python -m venv "$RUNNER_TEMP/ansible-lock"
          "$RUNNER_TEMP/ansible-lock/bin/pip" install --require-hashes -r script/requirements.lock
          "$RUNNER_TEMP/ansible-lock/bin/pip" check
      # Both locks were made for CPython 3.13 on 64-bit Arm (the device), and
      # this runner is neither, so check that every locked package has a wheel
      # for the device. --only-binary keeps a missing wheel from turning into
      # a build here. pip matches --platform tags exactly, so a package that
      # ships its Arm wheel only for a newer glibc tag needs that tag added.
      - name: Both locks have a wheel for the device
        run: |
          for lock in script/requirements.lock tm-control/backend/requirements.lock; do
            pip download --require-hashes --only-binary=:all: \
              --platform manylinux_2_28_aarch64 --platform manylinux_2_17_aarch64 --platform manylinux2014_aarch64 \
              --platform manylinux_2_31_aarch64 --platform manylinux_2_34_aarch64 --platform manylinux_2_35_aarch64 \
              --python-version 3.13 --implementation cp --abi cp313 --abi abi3 --abi none \
              -d "$RUNNER_TEMP/wheels" -r "$lock"
          done

  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tm-control/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the device's Node version
        id: node
        working-directory: .
        run: |
          v=$(grep -oP '^tmsetup_node_image:.*/node:\K[0-9]+\.[0-9]+\.[0-9]+' script/ansible/roles/tmsetup/vars/main.yml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: tm-control/ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
