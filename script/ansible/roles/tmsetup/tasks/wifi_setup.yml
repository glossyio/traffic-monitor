---
# tmsetup wifi setup tasks
- name: TMSetup - WiFi Setup - Install the Wi-Fi tools
  become: true
  ansible.builtin.apt:
    name: "{{ tmsetup_wifi_packages }}"
    state: present

- name: TMSetup - WiFi Setup - Read the Wi-Fi country
  become: true
  ansible.builtin.command: raspi-config nonint get_wifi_country
  register: tmsetup_wifi_country_register
  changed_when: false
  failed_when: false

# The country given with -w, else the one the device has, else US. The change applies at once; no reboot.
- name: TMSetup - WiFi Setup - Set the Wi-Fi country
  become: true
  ansible.builtin.command: raspi-config nonint do_wifi_country {{ tmsetup_wifi_country_wanted }}
  vars:
    tmsetup_wifi_country_wanted: >-
      {{ (tmsetup_wifi_country | upper) if (tmsetup_wifi_country | length > 0)
      else ((tmsetup_wifi_country_register.stdout | trim | upper)
      if (tmsetup_wifi_country_register.rc == 0 and (tmsetup_wifi_country_register.stdout | trim | length > 0))
      else 'US') }}
  when: tmsetup_wifi_country_wanted != (tmsetup_wifi_country_register.stdout | trim | upper)
  changed_when: true

- name: TMSetup - WiFi Setup - Copy wifi powersave config
  become: true
  ansible.builtin.copy:
    src: utils/88-z-wifi-powersave-off.conf
    dest: /etc/NetworkManager/conf.d/88-z-wifi-powersave-off.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart NetworkManager service

- name: TMSetup - WiFi Setup - Copy network connectivity check config
  become: true
  ansible.builtin.copy:
    src: utils/82-nm-connectivity-check.conf
    dest: /etc/NetworkManager/conf.d/82-nm-connectivity-check.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart NetworkManager service

# The old Wi-Fi check (cron entry, sudoers entry, scripts) is replaced by the hotspot profile below
- name: TMSetup - WiFi Setup - Remove the old Wi-Fi check from cron
  become: true
  ansible.builtin.cron:
    name: Traffic Monitor Wifi Check
    user: "{{ tmsetup_codeowner }}"
    state: absent

- name: TMSetup - WiFi Setup - Remove the old NetworkManager restart from sudoers
  become: true
  community.general.sudoers:
    name: "{{ tmsetup_codeowner }}"
    state: absent

- name: TMSetup - WiFi Setup - Remove the old Wi-Fi check scripts
  become: true
  loop:
    - wlan_check.sh
    - network-wlan-ap
  ansible.builtin.file:
    path: "{{ tmsetup_codedir }}/utils/{{ item }}"
    state: absent

# The same directories and modes as tm-control_setup.yml and tm-control_service.yml, so -t wifi works on its own
- name: TMSetup - WiFi Setup - Create the root job directory
  become: true
  ansible.builtin.file:
    path: '{{ tmsetup_libexec_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: TMSetup - WiFi Setup - Create the configuration directory
  become: true
  ansible.builtin.file:
    path: '{{ tmsetup_etc_dir }}'
    state: directory
    owner: root
    group: '{{ tmsetup_codegroup }}'
    mode: '0750'

# The firewall file and the DNS file come before the profile: a hotspot that NetworkManager starts the moment the
# profile exists must already have both. The DNS file needs no handler; dnsmasq reads it when the hotspot starts.
# The firewall file replaces the table in one step, so a reload leaves no moment without the rule.
- name: TMSetup - WiFi Setup - Install the hotspot firewall rules
  become: true
  ansible.builtin.template:
    src: network/tm-hotspot-firewall.nft.j2
    dest: '{{ tmsetup_etc_dir }}/hotspot-firewall.nft'
    owner: root
    group: root
    mode: '0644'
  notify: Reload the hotspot firewall

- name: TMSetup - WiFi Setup - Install the hotspot firewall unit
  become: true
  ansible.builtin.template:
    src: network/tm-hotspot-firewall.service.j2
    dest: /etc/systemd/system/tm-hotspot-firewall.service
    owner: root
    group: root
    mode: '0644'

# Started here too, not only in start_services.yml, so the table is loaded before the profile can bring the hotspot up
- name: TMSetup - WiFi Setup - Start and enable the hotspot firewall
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    name: tm-hotspot-firewall.service
    state: started

- name: TMSetup - WiFi Setup - Create the hotspot's DNS directory
  become: true
  ansible.builtin.file:
    path: /etc/NetworkManager/dnsmasq-shared.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: TMSetup - WiFi Setup - Make every name on the hotspot resolve to this device
  become: true
  ansible.builtin.template:
    src: network/tm-hotspot-dns.conf.j2
    dest: /etc/NetworkManager/dnsmasq-shared.d/tm-hotspot.conf
    owner: root
    group: root
    mode: '0644'

# tm-control's install copies all of the job scripts; this one is also needed for -t wifi alone
- name: TMSetup - WiFi Setup - Copy the hotspot helper
  become: true
  ansible.builtin.copy:
    src: tm-control/jobs/tm-hotspot-setup
    dest: '{{ tmsetup_libexec_dir }}/tm-hotspot-setup'
    owner: root
    group: root
    mode: '0755'

# Moves the radio between a saved network and the hotspot. The timer is enabled and started with the services
# (start_services.yml), which daemon-reloads for these two units.
- name: TMSetup - WiFi Setup - Copy the Wi-Fi retry script
  become: true
  ansible.builtin.copy:
    src: tm-control/jobs/tm-network-retry
    dest: '{{ tmsetup_libexec_dir }}/tm-network-retry'
    owner: root
    group: root
    mode: '0755'

- name: TMSetup - WiFi Setup - Install the Wi-Fi retry units
  become: true
  loop:
    - tm-network-retry.service
    - tm-network-retry.timer
  ansible.builtin.template:
    src: 'network/{{ item }}.j2'
    dest: '/etc/systemd/system/{{ item }}'
    owner: root
    group: root
    mode: '0644'

# Prints one JSON line. It writes the hotspot password to the password file, so the output is hidden. A refusal is one
# sentence on stderr with no password in it, which the next task shows.
- name: TMSetup - WiFi Setup - Create or adopt the hotspot
  become: true
  no_log: true
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -EP
      - '{{ tmsetup_libexec_dir }}/tm-hotspot-setup'
      - --profile
      - '{{ tmsetup_hotspot_profile }}'
      - --device
      - '{{ tmsetup_wifi_device }}'
      - --address
      - "{{ tmsetup_hotspot_address }}/{{ tmsetup_hotspot_subnet.split('/')[1] }}"
      - --ssid
      - "TM-{{ tmsetup_raspberry_pi_serial[-4:] | upper }}"
      - --password-file
      - '{{ tmsetup_secrets_dir }}/hotspot_password'
      - --group
      - '{{ tmsetup_codegroup }}'
  register: tmsetup_wifi_hotspot_register
  failed_when: false
  changed_when: tmsetup_wifi_hotspot_register.rc == 0 and (tmsetup_wifi_hotspot_register.stdout | from_json).changed

- name: TMSetup - WiFi Setup - Stop if the hotspot couldn't be set up
  ansible.builtin.fail:
    msg: "The hotspot couldn't be set up: {{ tmsetup_wifi_hotspot_register.stderr | trim }}"
  when: tmsetup_wifi_hotspot_register.rc != 0

- name: TMSetup - WiFi Setup - Read whether the Wi-Fi radio is on
  become: true
  ansible.builtin.command: nmcli radio wifi
  register: tmsetup_wifi_radio_register
  changed_when: false

- name: TMSetup - WiFi Setup - Turn the Wi-Fi radio on
  become: true
  ansible.builtin.command: nmcli radio wifi on
  when:
    - tmsetup_wifi_hotspot_register.rc == 0
    - (tmsetup_wifi_hotspot_register.stdout | from_json).autoconnect
    - tmsetup_wifi_radio_register.stdout | trim == 'disabled'
  changed_when: true
...
