---
# task file to start all services
- name: TMSetup - Start Services - Start and enable NetworkManager.service
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    name: NetworkManager.service
    state: started

# Not held back by a pending reboot: the table must be in place before the hotspot can start, and the timer is what
# brings the hotspot back after a saved network goes away
- name: TMSetup - Start Services - Start and enable the hotspot firewall and the Wi-Fi retry timer
  become: true
  loop:
    - tm-hotspot-firewall.service
    - tm-network-retry.timer
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    name: "{{ item }}"
    state: started

# Enabled and never started: at boot it carries on a cut-off update's switch when the marker exists, and with no marker
# its condition leaves it inactive. A run of the installer must not start it, or a finished update's files could be
# read as a cut-off one.
- name: TMSetup - Start Services - Enable the update resume unit
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    name: tm-update-resume.service

- name: TMSetup - Start Services - Start and enable sysstat.service
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    name: sysstat.service
    state: started

# cockpit.socket starts Cockpit on demand on port 9090; cockpit-podman's page needs podman.socket
- name: TMSetup - Start Services - Start and enable Cockpit sockets
  become: true
  loop:
    - cockpit.socket
    - podman.socket
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    name: "{{ item }}"
    state: started

- name: TMSetup - Start Services - Start and enable traffic-monitor services
  become: true
  loop:
    - go2rtc_server.service
    - traffic-monitor.service
    - tm-control.service
    - revproxy.service
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    name: "{{ item }}"
    state: "{{ 'stopped' if tmsetup_restart_required else 'started' }}"

...
