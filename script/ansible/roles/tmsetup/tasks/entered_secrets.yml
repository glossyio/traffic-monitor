---
# TMSetup - Entered Secrets: move the ThingsBoard and Plate Recognizer secrets that older installs kept in
# Node-RED's config.yml, or that a person typed into plate-recognizer.env, into the secrets directory.
# main.yml imports this right after tm-control is installed and before any task renders those files: -f replaces
# both from templates that hold no value, and the Plate Recognizer setup rewrites the env file's TOKEN and
# LICENSE_KEY lines from the secrets on every run, so each value's only copy must have moved first.
# tm-control migrate runs as root, not as the code owner, because only root writes the secret files. It prints no
# value, only which keys moved, so this task isn't no_log. tmsetup_secrets was read before the move, so the
# entered secrets are read again for the templates that follow.
- name: TMSetup - Entered Secrets - Check for config files that may hold one
  become: true
  loop:
    - '{{ tmsetup_codedir }}/node-red-tm/config/config.yml'
    - '{{ tmsetup_codedir }}/plate-recognizer/plate-recognizer.env'
  ansible.builtin.stat:
    path: '{{ item }}'
    get_checksum: false
  register: tmsetup_entered_secrets_stat_register

# Node-RED gets the moved tokens from node-red-tm.env, which its setup writes from the secrets later in this run.
# Only Node-RED restarts: a move never changes what the Plate Recognizer container sees (its env lines are written
# from the same values), and that service may not exist.
- name: TMSetup - Entered Secrets - Move them to the secrets directory
  become: true
  when: tmsetup_entered_secrets_stat_register.results | selectattr('stat.exists') | list | length > 0
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/local/bin/tm-control', 'migrate', '--secrets-dir', tmsetup_secrets_dir]
         + (['--node-red-config', tmsetup_codedir ~ '/node-red-tm/config/config.yml']
            if tmsetup_entered_secrets_stat_register.results[0].stat.exists else [])
         + (['--plate-recognizer-env', tmsetup_codedir ~ '/plate-recognizer/plate-recognizer.env']
            if tmsetup_entered_secrets_stat_register.results[1].stat.exists else []) }}
  register: tmsetup_entered_secrets_migrate_register
  # One line per file, each ending in ": up to date" when it had nothing to move
  changed_when: >-
    tmsetup_entered_secrets_migrate_register.stdout_lines | reject('search', ': up to date$') | list | length > 0
  notify: Restart node-red-tm.service

- name: TMSetup - Entered Secrets - Show warnings from the move
  ansible.builtin.debug:
    msg: '{{ tmsetup_entered_secrets_migrate_register.stderr_lines }}'
  when: "'WARNING' in tmsetup_entered_secrets_migrate_register.stderr | default('')"

- name: TMSetup - Entered Secrets - Re-read the entered secrets
  become: true
  no_log: true
  loop: '{{ tmsetup_entered_secret_names }}'
  ansible.builtin.slurp:
    src: '{{ tmsetup_secrets_dir }}/{{ item }}'
  register: tmsetup_entered_secrets_slurp_register

- name: TMSetup - Entered Secrets - Update the secrets fact
  no_log: true
  ansible.builtin.set_fact:
    tmsetup_secrets: >-
      {{ tmsetup_secrets | combine(dict(tmsetup_entered_secret_names | zip(tmsetup_entered_secrets_slurp_register.results
         | map(attribute='content') | map('b64decode') | map('trim')))) }}
...
