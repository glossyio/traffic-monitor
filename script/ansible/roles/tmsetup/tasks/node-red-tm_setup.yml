---
# TMSetup - Node-RED-TM Setup tasks

- name: TMSetup - Node-RED-TM Setup - Check for radars
  loop: "{{ tmsetup_radar_paths }}"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: tmsetup_radarpath_stat_register

- name: TMSetup Node-RED-TM Setup - Add existing radars to list
  loop: "{{ tmsetup_radarpath_stat_register.results }}"
  when: item['stat']['exists'] | bool
  ansible.builtin.set_fact:
    tmsetup_radars_confirmed: "{{ tmsetup_radars_confirmed | default([]) + [item['stat']['path']] }}"

- name: TMSetup - Node-RED-TM Setup - Create Node-RED-TM Directories
  become: true
  loop:
    - '{{ tmsetup_codedir }}'
    - '{{ tmsetup_codedir }}/node-red-tm'
    - '{{ tmsetup_codedir }}/node-red-tm/config'
    - '{{ tmsetup_codedir }}/node-red-tm/data'
    - '{{ tmsetup_codedir }}/node-red-tm/db'
    - '{{ tmsetup_codedir }}/node-red-tm/schema'
    - '{{ tmsetup_codedir }}/node-red-tm/schema/migrations'
  ansible.builtin.file:
    group: '{{ tmsetup_codegroup }}'
    mode: '0750'
    owner: '{{ tmsetup_codeowner }}'
    path: '{{ item }}'
    state: directory
  notify: Restart node-red-tm.service

- name: TMSetup - Node-RED-TM Setup - Copy relevant static files for node red deployment
  become: true
  loop:
    - node-red-tm/data/flows_cred.json
    - node-red-tm/data/README.md
    - node-red-tm/data/settings.js
    - node-red-tm/data/package.json
    - node-red-tm/data/package-lock.json
    - node-red-tm/data/upload-lists.json
  ansible.builtin.copy:
    dest: '{{ tmsetup_codedir }}/{{ item }}'
    group: '{{ tmsetup_codegroup }}'
    mode: '0644'
    owner: '{{ tmsetup_codeowner }}'
    src: 'container/{{ item }}'
  notify: Restart node-red-tm.service

- name: TMSetup - Node-RED-TM Setup - Copy tmdb schema runner and migrations
  become: true
  loop:
    - node-red-tm/schema/tmdb_migrate.py
    - node-red-tm/schema/migrations/
  ansible.builtin.copy:
    dest: '{{ tmsetup_codedir }}/{{ item }}'
    group: '{{ tmsetup_codegroup }}'
    mode: '0644'
    owner: '{{ tmsetup_codeowner }}'
    src: 'container/{{ item }}'
  notify: Restart node-red-tm.service

- name: TMSetup - Node-RED-TM Setup - Find deployed tmdb migrations
  become: true
  ansible.builtin.find:
    paths: '{{ tmsetup_codedir }}/node-red-tm/schema/migrations'
  register: tmsetup_node_red_tm_migrations_find_register

# A migration left behind from another branch or a test would be applied, or block the runner
# with a duplicate number.
- name: TMSetup - Node-RED-TM Setup - Remove tmdb migrations that aren't in the repo
  become: true
  loop: "{{ tmsetup_node_red_tm_migrations_find_register['files'] | map(attribute='path') | map('basename')
    | difference(query('ansible.builtin.fileglob', 'container/node-red-tm/schema/migrations/*') | map('basename')) }}"
  ansible.builtin.file:
    path: '{{ tmsetup_codedir }}/node-red-tm/schema/migrations/{{ item }}'
    state: absent
  notify: Restart node-red-tm.service

# Reference copies only; the device never runs them, so they don't restart Node-RED.
- name: TMSetup - Node-RED-TM Setup - Copy tmdb schema docs
  become: true
  loop:
    - node-red-tm/schema/schema.sql
    - node-red-tm/schema/README.md
  ansible.builtin.copy:
    dest: '{{ tmsetup_codedir }}/{{ item }}'
    group: '{{ tmsetup_codegroup }}'
    mode: '0644'
    owner: '{{ tmsetup_codeowner }}'
    src: 'container/{{ item }}'

- name: TMSetup - Node-RED-TM Setup - Create Node-RED-TM Container files
  become: true
  ansible.builtin.template:
    backup: true
    dest: '{{ tmsetup_codedir }}/node-red-tm/Containerfile'
    force: true
    group: '{{ tmsetup_codegroup }}'
    mode: '0644'
    owner: '{{ tmsetup_codeowner }}'
    src: container/node-red-tm/Containerfile.j2
  notify: Restart node-red-tm.service

- name: TMSetup - Node-RED-TM Setup - Create Node-RED-TM Configs
  become: true
  diff: false
  loop:
    - config/config.yml
    - node-red-tm.env
  ansible.builtin.template:
    backup: true
    dest: '{{ tmsetup_codedir }}/node-red-tm/{{ item }}'
    force: '{{ tmsetup_force_configs }}'
    group: '{{ tmsetup_codegroup }}'
    mode: '0640'
    owner: '{{ tmsetup_codeowner }}'
    src: 'container/node-red-tm/{{ item }}.j2'
  notify: Restart node-red-tm.service

# The template above doesn't rewrite an existing node-red-tm.env without -f, and settings.js refuses every
# editor login without TM_NR_TOKEN_KEY, so the key goes in on every run.
- name: TMSetup - Node-RED-TM Setup - Check for node-red-tm.env
  become: true
  ansible.builtin.stat:
    path: '{{ tmsetup_codedir }}/node-red-tm/node-red-tm.env'
    get_checksum: false
  register: tmsetup_node_red_env_stat_register

- name: TMSetup - Node-RED-TM Setup - Add the editor login key to node-red-tm.env
  become: true
  no_log: true
  when: tmsetup_node_red_env_stat_register.stat.exists
  ansible.builtin.lineinfile:
    path: '{{ tmsetup_codedir }}/node-red-tm/node-red-tm.env'
    regexp: '^TM_NR_TOKEN_KEY='
    line: "TM_NR_TOKEN_KEY={{ tmsetup_secrets['node_red_token_key'] }}"
  notify: Restart node-red-tm.service

# The same for the token tm-control sends to Node-RED's /tm-internal/ endpoints, which refuse every request without it.
- name: TMSetup - Node-RED-TM Setup - Add the internal status token to node-red-tm.env
  become: true
  no_log: true
  when: tmsetup_node_red_env_stat_register.stat.exists
  ansible.builtin.lineinfile:
    path: '{{ tmsetup_codedir }}/node-red-tm/node-red-tm.env'
    regexp: '^TM_INTERNAL_TOKEN='
    line: "TM_INTERNAL_TOKEN={{ tmsetup_secrets['node_red_internal_token'] }}"
  notify: Restart node-red-tm.service

# TM_VERSION is the installer's own version. An existing node-red-tm.env isn't rewritten without -f, so an upgraded
# unit's Node-RED would keep reporting the old version in its status and in the upload's device attribute. The task
# sets it on every run. It isn't a secret. (The setup history takes its version from the control app's manifest.)
- name: TMSetup - Node-RED-TM Setup - Refresh TM_VERSION in node-red-tm.env
  become: true
  when: tmsetup_node_red_env_stat_register.stat.exists
  ansible.builtin.lineinfile:
    path: '{{ tmsetup_codedir }}/node-red-tm/node-red-tm.env'
    regexp: '^TM_VERSION='
    line: 'TM_VERSION={{ tmsetup_tm_version }}'
  notify: Restart node-red-tm.service

# And for the entered secrets the flows read, so a value set on the Device page reaches an older env file.
# An empty secret file writes an empty value.
- name: TMSetup - Node-RED-TM Setup - Add the ThingsBoard access token to node-red-tm.env
  become: true
  no_log: true
  when: tmsetup_node_red_env_stat_register.stat.exists
  ansible.builtin.lineinfile:
    path: '{{ tmsetup_codedir }}/node-red-tm/node-red-tm.env'
    regexp: '^TM_THINGSBOARD_ACCESS_TOKEN='
    line: "TM_THINGSBOARD_ACCESS_TOKEN={{ tmsetup_secrets['thingsboard_access_token'] }}"
  notify: Restart node-red-tm.service

- name: TMSetup - Node-RED-TM Setup - Add the Plate Recognizer token to node-red-tm.env
  become: true
  no_log: true
  when: tmsetup_node_red_env_stat_register.stat.exists
  ansible.builtin.lineinfile:
    path: '{{ tmsetup_codedir }}/node-red-tm/node-red-tm.env'
    regexp: '^TM_PLATE_RECOGNIZER_TOKEN='
    line: "TM_PLATE_RECOGNIZER_TOKEN={{ tmsetup_secrets['plate_recognizer_token'] }}"
  notify: Restart node-red-tm.service

# The flows open the port that each TM_RADAR_SERIAL_PORT_ line in node-red-tm.env names, so the device's file says
# which port is whose; a name the file doesn't give takes the role's path in its place, as the template does. Read
# after the file is written above; it holds secrets, so neither the read nor the fact built from its text is shown.
- name: TMSetup - Node-RED-TM Setup - Read node-red-tm.env for the radar ports
  become: true
  no_log: true
  when: tmsetup_node_red_env_stat_register.stat.exists
  ansible.builtin.slurp:
    src: '{{ tmsetup_codedir }}/node-red-tm/node-red-tm.env'
  register: tmsetup_node_red_env_slurp_register

# The padding gives every name a path, '' past the end of a shorter tmsetup_radar_paths.
- name: TMSetup - Node-RED-TM Setup - Find the port of each radar name
  no_log: true
  vars:
    radar_names: [TM_RADAR_SERIAL_PORT_00, TM_RADAR_SERIAL_PORT_01, TM_RADAR_SERIAL_PORT_02, TM_RADAR_SERIAL_PORT_03]
    radar_line: '^(TM_RADAR_SERIAL_PORT_0[0-3])=[ \t]*(.*?)[ \t\r]*$'
    env_text: "{{ tmsetup_node_red_env_slurp_register.content | b64decode if tmsetup_node_red_env_stat_register.stat.exists else '' }}"
  ansible.builtin.set_fact:
    tmsetup_radar_env_ports: "{{ dict(radar_names | zip(tmsetup_radar_paths + ['', '', '', '']))
      | combine(dict(env_text | regex_findall(radar_line, multiline=true))) }}"

# A radar whose port wasn't there isn't passed into the container either (node-red-tm.container.j2), so its serial
# nodes are switched off below. A radar plugged in later needs this run again: tmsetup.sh -t node-red-tm.
- name: TMSetup - Node-RED-TM Setup - List the radar names whose port isn't there
  ansible.builtin.set_fact:
    tmsetup_radars_missing: "{{ tmsetup_radar_env_ports | dict2items
      | rejectattr('value', 'in', tmsetup_radars_confirmed | default([])) | map(attribute='key') | list }}"

- name: TMSetup - Node-RED-TM Setup - Write flows.json with the serial nodes of missing radars off
  become: true
  ansible.builtin.template:
    dest: '{{ tmsetup_codedir }}/node-red-tm/data/flows.json'
    group: '{{ tmsetup_codegroup }}'
    mode: '0644'
    owner: '{{ tmsetup_codeowner }}'
    src: node-red-tm/flows.json.j2
  notify: Restart node-red-tm.service

- name: TMSetup - Node-RED-TM Setup - Create Podman container and build Quadlets for tm-node-red
  become: true
  loop:
    - node-red-tm.build
    - node-red-tm.container
  ansible.builtin.template:
    dest: '/etc/containers/systemd/{{ item }}'
    group: root
    mode: '0644'
    owner: root
    src: 'container/node-red-tm/{{ item }}.j2'
  notify: Restart node-red-tm.service

- name: TMSetup - Node-RED-TM Setup - Build node-red-tm image (this can take a while)
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    name: node-red-tm-build.service
    state: started
  notify: Restart node-red-tm.service

...
