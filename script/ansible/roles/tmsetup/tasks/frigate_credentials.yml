---
# TMSetup - Frigate Credentials: give an existing Frigate install the go2rtc RTSP login.
# main.yml imports this with both the go2rtc and frigate tags, because the go2rtc tag turns the login
# on in go2rtc.yaml, and Frigate can't read the camera until frigate.env and its config.yml have it.
# These steps exist because tmsetup doesn't overwrite an existing device's frigate.env and config.yml
# without -f. Under -t go2rtc alone Frigate may not be installed yet, so each step runs only on a file
# that's there.
- name: TMSetup - Frigate Credentials - Check for Frigate's settings files
  become: true
  loop:
    - '{{ tmsetup_codedir }}/frigate/frigate.env'
    - '{{ tmsetup_codedir }}/frigate/config/config.yml'
  ansible.builtin.stat:
    path: '{{ item }}'
    get_checksum: false
  register: tmsetup_frigate_settings_stat_register

- name: TMSetup - Frigate Credentials - Add go2rtc RTSP credentials to frigate.env
  become: true
  no_log: true
  when: tmsetup_frigate_settings_stat_register.results[0].stat.exists
  loop:
    - { key: FRIGATE_GO2RTC_RTSP_USER, value: '{{ tmsetup_go2rtc_rtsp_user }}' }
    - { key: FRIGATE_GO2RTC_RTSP_PASSWORD, value: "{{ tmsetup_secrets['go2rtc_rtsp_password'] }}" }
  ansible.builtin.lineinfile:
    path: '{{ tmsetup_codedir }}/frigate/frigate.env'
    regexp: '^{{ item.key }}='
    line: '{{ item.key }}={{ item.value }}'
  notify: Restart frigate.service

- name: TMSetup - Frigate Credentials - Update Frigate config from older installs
  become: true
  when: tmsetup_frigate_settings_stat_register.results[1].stat.exists
  ansible.builtin.command:
    argv:
      - /usr/sbin/runuser
      - -u
      - '{{ tmsetup_codeowner }}'
      - --
      - /usr/local/bin/tm-control
      - migrate
      - --frigate-config
      - '{{ tmsetup_codedir }}/frigate/config/config.yml'
  register: tmsetup_frigate_migrate_register
  changed_when: "'updated' in tmsetup_frigate_migrate_register.stdout"
  notify: Restart frigate.service

- name: TMSetup - Frigate Credentials - Show warnings from the Frigate config update
  ansible.builtin.debug:
    msg: '{{ tmsetup_frigate_migrate_register.stderr_lines }}'
  when: "'WARNING' in tmsetup_frigate_migrate_register.stderr | default('')"
...
