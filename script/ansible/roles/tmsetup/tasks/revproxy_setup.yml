---

- name: TMSetup - revproxy Setup - Create NGinx directory
  become: true
  loop:
    - { path: '{{ tmsetup_codedir }}', mode: '0750' }
    - { path: '{{ tmsetup_codedir }}/revproxy', mode: '0750' }
    - { path: '{{ tmsetup_codedir }}/revproxy/html', mode: '0755' }
    - { path: '{{ tmsetup_codedir }}/revproxy/tm', mode: '0750' }
    - { path: '{{ tmsetup_codedir }}/revproxy/tm/locations', mode: '0750' }
    - { path: '{{ tmsetup_codedir }}/revproxy/tm/snippets', mode: '0750' }
  ansible.builtin.file:
    mode: '{{ item["mode"] }}'
    owner: '{{ tmsetup_codeowner }}'
    path: '{{ item["path"] }}'
    state: directory
  notify: Restart revproxy.service

- name: TMSetup - revproxy Setup - Create NGinx Containerfile
  become: true
  ansible.builtin.template:
    backup: false
    dest: '{{ tmsetup_codedir }}/revproxy/Containerfile'
    force: true
    group: '{{ tmsetup_codegroup }}'
    mode: '0640'
    owner: '{{ tmsetup_codeowner }}'
    src: 'container/revproxy/Containerfile.j2'
  notify: Restart revproxy.service

- name: TMSetup - revproxy Setup - Create NGinx quadlets
  become: true
  loop:
    - revproxy.build
    - revproxy.container
  ansible.builtin.template:
    dest: '/etc/containers/systemd/{{ item }}'
    group: root
    mode: '0644'
    owner: root
    src: 'container/revproxy/{{ item }}.j2'
  notify: Restart revproxy.service

- name: TMSetup - revproxy Setup - Build container
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    name: revproxy-build.service
    state: started
  notify: Restart revproxy.service

- name: TMSetup - revproxy Setup - Find NGinx check directories left by an interrupted run
  become: true
  ansible.builtin.find:
    file_type: directory
    hidden: true
    paths: '{{ tmsetup_codedir }}/revproxy'
    patterns: '.nginx-check.*'
  register: tmsetup_revproxy_stale_check_dirs_register

- name: TMSetup - revproxy Setup - Remove NGinx check directories left by an interrupted run
  become: true
  loop: "{{ tmsetup_revproxy_stale_check_dirs_register['files'] | map(attribute='path') | list }}"
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent

# Render the nginx config into a throwaway directory and check it there, so a
# failed check leaves the deployed config and the running proxy untouched.
- name: TMSetup - revproxy Setup - Check NGinx config before deploying it
  block:
    - name: TMSetup - revproxy Setup - Create NGinx check directory
      become: true
      ansible.builtin.tempfile:
        path: '{{ tmsetup_codedir }}/revproxy'
        prefix: '.nginx-check.'
        state: directory
      changed_when: false
      register: tmsetup_revproxy_check_dir_register

    - name: TMSetup - revproxy Setup - Create NGinx check subdirectories
      become: true
      loop:
        - tm/locations
        - tm/snippets
      ansible.builtin.file:
        mode: '0750'
        path: '{{ tmsetup_revproxy_check_dir_register["path"] }}/{{ item }}'
        state: directory
      changed_when: false

    - name: TMSetup - revproxy Setup - Render NGinx config for the check
      become: true
      loop: >-
        {{ ['nginx.conf']
           + tmsetup_revproxy_snippets | map('regex_replace', '^', 'tm/snippets/') | list
           + tmsetup_revproxy_locations | map('regex_replace', '^', 'tm/locations/') | list }}
      ansible.builtin.template:
        dest: '{{ tmsetup_revproxy_check_dir_register["path"] }}/{{ item }}'
        mode: '0640'
        src: 'container/revproxy/{{ item }}.j2'
      changed_when: false

    # Runs nginx -t in a throwaway container and waits for it; a non-zero exit fails the task.
    - name: TMSetup - revproxy Setup - Check NGinx config
      become: true
      containers.podman.podman_container:
        command: -t
        detach: false
        entrypoint: nginx
        image: '{{ tmsetup_revproxy_image }}'
        name: revproxy-nginx-check
        rm: true
        state: started
        volume: '{{ tmsetup_revproxy_check_volumes }}'
      changed_when: false
      vars:
        # The shared mounts, read-only from the check directory, e.g.
        # <check dir>/nginx.conf:/etc/nginx/nginx.conf:ro
        tmsetup_revproxy_check_volumes: >-
          {{ tmsetup_revproxy_config_mounts
             | map(attribute='path')
             | map('regex_replace', '^', tmsetup_revproxy_check_dir_register['path'] ~ '/')
             | zip(tmsetup_revproxy_config_mounts | map(attribute='target'))
             | map('join', ':')
             | map('regex_replace', '$', ':ro')
             | list }}
  always:
    - name: TMSetup - revproxy Setup - Remove NGinx check directory
      become: true
      ansible.builtin.file:
        path: '{{ tmsetup_revproxy_check_dir_register["path"] }}'
        state: absent
      changed_when: false
      when: tmsetup_revproxy_check_dir_register["path"] is defined

- name: TMSetup - revproxy Setup - Create NGinx config file
  become: true
  loop: "{{ ['revproxy/nginx.conf'] + tmsetup_revproxy_snippets | map('regex_replace', '^', 'revproxy/tm/snippets/') | list }}"
  ansible.builtin.template:
    backup: false
    dest: '{{ tmsetup_codedir }}/{{ item }}'
    force: true
    group: '{{ tmsetup_codegroup }}'
    mode: '0640'
    owner: '{{ tmsetup_codeowner }}'
    src: 'container/{{ item }}.j2'
  notify: Restart revproxy.service

- name: TMSetup - revproxy Setup - Create NGinx location files
  become: true
  loop: '{{ tmsetup_revproxy_locations }}'
  ansible.builtin.template:
    backup: false
    dest: '{{ tmsetup_codedir }}/revproxy/tm/locations/{{ item }}'
    force: true
    group: '{{ tmsetup_codegroup }}'
    mode: '0640'
    owner: '{{ tmsetup_codeowner }}'
    src: 'container/revproxy/tm/locations/{{ item }}.j2'
  notify: Restart revproxy.service

- name: TMSetup - revproxy Setup - Find deployed NGinx location files
  become: true
  ansible.builtin.find:
    paths: '{{ tmsetup_codedir }}/revproxy/tm/locations'
    patterns: '*.conf'
  register: tmsetup_revproxy_locations_find_register

# A renamed or removed location file left behind would keep proxying, or
# duplicate a location and stop nginx from starting.
- name: TMSetup - revproxy Setup - Remove unlisted NGinx location files
  become: true
  loop: "{{ tmsetup_revproxy_locations_find_register['files'] | map(attribute='path') | map('basename') | difference(tmsetup_revproxy_locations) }}"
  ansible.builtin.file:
    path: '{{ tmsetup_codedir }}/revproxy/tm/locations/{{ item }}'
    state: absent
  notify: Restart revproxy.service

# nginx serves the bind-mounted html directory at once, so change it only after
# the check passes. tm-control's UI is the home page now (tm-control-ui.conf).
- name: TMSetup - revproxy Setup - Remove the old home page
  become: true
  ansible.builtin.file:
    path: '{{ tmsetup_codedir }}/revproxy/html/index.html'
    state: absent

# Served by the auth snippets' error_page when tm-control doesn't answer
- name: TMSetup - revproxy Setup - Create the rescue page
  become: true
  ansible.builtin.template:
    backup: false
    dest: '{{ tmsetup_codedir }}/revproxy/html/unavailable.html'
    force: true
    group: '{{ tmsetup_codegroup }}'
    mode: '0644'
    owner: '{{ tmsetup_codeowner }}'
    src: 'container/revproxy/html/unavailable.html.j2'
  notify: Restart revproxy.service

...
