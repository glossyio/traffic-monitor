---
# TMSetup - Update Stage: the first half of an update's prepare, run by update_prepare.yml while the installed
# version keeps running. It refuses what an update can't do, downloads everything the switch (update mode) reads into
# tmsetup_update_stage_dir, and tries the settings changes on the new code without writing them. It writes only into
# tmsetup_update_work_dir and tmsetup_update_reason_file, except that apt's package index is refreshed and its package
# cache fills, the one thing written outside the work folder.
# A refusal (update_refuse.yml) is a code the caller reads: hardware_needs_installer, no_internet,
# settings_need_attention.
- name: TMSetup - Update Stage - Set variables
  ansible.builtin.import_tasks:
    file: set_vars.yml

- name: TMSetup - Update Stage - Check for attached detectors
  ansible.builtin.import_tasks:
    file: detectors_check.yml

# An update changes no driver. A detector that is attached but has none yet needs the full installer, as
# detectors_install.yml's blocks say.
- name: TMSetup - Update Stage - Refuse an attached Hailo-8L with no driver
  when:
    - tmsetup_detectors.hailo8l is defined
    - tmsetup_detectors.hailo8l.exists
    - not tmsetup_detectors.hailo8l.dev_path_available
  ansible.builtin.include_tasks: update_refuse.yml
  vars:
    tmsetup_update_reason: hardware_needs_installer

- name: TMSetup - Update Stage - Refuse an attached PCIe Coral TPU with no driver
  when:
    - tmsetup_detectors.edgetpu_pci is defined
    - tmsetup_detectors.edgetpu_pci.exists
    - not tmsetup_detectors.edgetpu_pci.dev_path_available
  ansible.builtin.include_tasks: update_refuse.yml
  vars:
    tmsetup_update_reason: hardware_needs_installer

# The first download asks once whether the internet answers, so an update without it stops before it downloads anything
- name: TMSetup - Update Stage - Check that the internet answers
  block:
    - name: TMSetup - Update Stage - Ask GitHub for the go2rtc release
      # GitHub answers with a redirect to a signed download address, which may refuse a HEAD. The redirect is the
      # answer that shows GitHub is reachable, so it isn't followed.
      ansible.builtin.uri:
        follow_redirects: none
        method: HEAD
        status_code: [200, 301, 302, 303, 307, 308]
        timeout: 20
        url: 'https://github.com/AlexxIT/go2rtc/releases/download/{{ tmsetup_go2rtc_version }}/go2rtc_linux_{{ tmsetup_dpkg_architecture }}'
  rescue:
    - name: TMSetup - Update Stage - Refuse an update with no internet
      ansible.builtin.include_tasks: update_refuse.yml
      vars:
        tmsetup_update_reason: no_internet

- name: TMSetup - Update Stage - Create the stage directories
  become: true
  loop:
    - '{{ tmsetup_update_stage_dir }}'
    - '{{ tmsetup_update_stage_dir }}/wheels'
    - '{{ tmsetup_update_stage_dir }}/coral'
  ansible.builtin.file:
    group: root
    mode: '0755'
    owner: root
    path: '{{ item }}'
    state: directory

# Every package the switch installs, downloaded into apt's cache so that installing it needs no internet. The names
# are base_setup.yml's and podman_setup.yml's.
- name: TMSetup - Update Stage - Refresh the package index
  become: true
  ansible.builtin.command:
    argv:
      - apt-get
      - update
  changed_when: false

- name: TMSetup - Update Stage - Download the packages
  become: true
  ansible.builtin.command:
    argv: >-
      {{ ['apt-get', 'install', '--download-only', '--yes'] + tmsetup_packages + tmsetup_podman_packages }}
  changed_when: false

- name: TMSetup - Update Stage - Download the packages from backports
  become: true
  ansible.builtin.command:
    argv: >-
      {{ ['apt-get', 'install', '--download-only', '--yes', '--target-release',
          ansible_facts['distribution_release'] ~ '-backports'] + tmsetup_packages_backports }}
  changed_when: false

# The checksum verifies the download, as go2rtc_setup.yml's does
- name: TMSetup - Update Stage - Download go2rtc
  become: true
  ansible.builtin.get_url:
    checksum: 'sha256:{{ tmsetup_go2rtc_sha256[tmsetup_dpkg_architecture] }}'
    dest: '{{ tmsetup_update_stage_dir }}/go2rtc_linux_{{ tmsetup_dpkg_architecture }}'
    group: root
    mode: '0755'
    owner: root
    url: 'https://github.com/AlexxIT/go2rtc/releases/download/{{ tmsetup_go2rtc_version }}/go2rtc_linux_{{ tmsetup_dpkg_architecture }}'

# The two Coral files, under frigate_setup.yml's condition for downloading them
- name: TMSetup - Update Stage - Download the Coral TPU yolov9 model
  become: true
  when:
    - >-
      ((tmsetup_detectors.edgetpu_pci.dev_path_available | default(false) and tmsetup_detectors.edgetpu_pci.exists | default(false)) or tmsetup_detectors.edgetpu_pci.fresh_install | default(false)) or
      ((tmsetup_detectors.edgetpu_usb.dev_path_available | default(false) and tmsetup_detectors.edgetpu_usb.exists | default(false)) or tmsetup_detectors.edgetpu_usb.fresh_install | default(false))
  ansible.builtin.get_url:
    checksum: "sha256:{{ tmsetup_frigate_coral_model_sha256 }}"
    dest: "{{ tmsetup_update_stage_dir }}/coral/{{ tmsetup_frigate_coral_model_file }}"
    mode: '0644'
    url: "https://github.com/dbro/frigate-detector-edgetpu-yolo9/releases/download/{{ tmsetup_frigate_coral_model_release }}/{{ tmsetup_frigate_coral_model_file }}"

- name: TMSetup - Update Stage - Download the labels for the Coral TPU yolov9 model
  become: true
  when:
    - >-
      ((tmsetup_detectors.edgetpu_pci.dev_path_available | default(false) and tmsetup_detectors.edgetpu_pci.exists | default(false)) or tmsetup_detectors.edgetpu_pci.fresh_install | default(false)) or
      ((tmsetup_detectors.edgetpu_usb.dev_path_available | default(false) and tmsetup_detectors.edgetpu_usb.exists | default(false)) or tmsetup_detectors.edgetpu_usb.fresh_install | default(false))
  ansible.builtin.get_url:
    checksum: "sha256:{{ tmsetup_frigate_coral_labels_sha256 }}"
    dest: "{{ tmsetup_update_stage_dir }}/coral/labels-coco17.txt"
    mode: '0644'
    url: "https://raw.githubusercontent.com/dbro/frigate-detector-edgetpu-yolo9/{{ tmsetup_frigate_coral_model_release }}/labels-coco17.txt"

# The tm-control code of the tree this playbook came from. Update mode unarchives it into the install's backend
# folder, so its one top-level entry is tm_control/, as the role's `copy` of that folder gives.
- name: TMSetup - Update Stage - Find the tree's tm-control code
  ansible.builtin.set_fact:
    tmsetup_update_backend_dir: '{{ role_path }}/files/tm-control/backend'

- name: TMSetup - Update Stage - Archive the tm_control package
  become: true
  ansible.builtin.command:
    argv:
      - tar
      - --create
      - --file
      - '{{ tmsetup_update_stage_dir }}/tm_control.tar'
      - --directory
      - '{{ tmsetup_update_backend_dir }}'
      - tm_control
  changed_when: true

# The wheels the new lock names are downloaded (each checked against the lock's hash) and then installed from that
# folder alone into a throwaway venv, which proves update mode's offline install and gives the dry run the new
# code's packages.
- name: TMSetup - Update Stage - Create the check virtual environment
  become: true
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - '{{ tmsetup_update_work_dir }}/check-venv'
    creates: '{{ tmsetup_update_work_dir }}/check-venv/bin/python'

- name: TMSetup - Update Stage - Download the wheels
  become: true
  ansible.builtin.command:
    argv:
      - '{{ tmsetup_update_work_dir }}/check-venv/bin/pip'
      - download
      - --no-input
      - --no-cache-dir
      - --disable-pip-version-check
      - --require-hashes
      - --requirement
      - '{{ tmsetup_update_backend_dir }}/requirements.lock'
      - --dest
      - '{{ tmsetup_update_stage_dir }}/wheels'
  changed_when: false

- name: TMSetup - Update Stage - Install the wheels without the internet
  become: true
  ansible.builtin.command:
    argv:
      - '{{ tmsetup_update_work_dir }}/check-venv/bin/pip'
      - install
      - --no-input
      - --no-cache-dir
      - --disable-pip-version-check
      - --no-index
      - --find-links
      - '{{ tmsetup_update_stage_dir }}/wheels'
      - --require-hashes
      - --requirement
      - '{{ tmsetup_update_backend_dir }}/requirements.lock'
  changed_when: false

# The same stats and the same files as the real steps (entered_secrets.yml, frigate_credentials.yml), so the dry run
# tries exactly what the switch will do. The code is the new tree's, and PYTHONDONTWRITEBYTECODE keeps it from
# writing into the tree.
- name: TMSetup - Update Stage - Check for config files that may hold an entered secret
  become: true
  loop:
    - '{{ tmsetup_codedir }}/node-red-tm/config/config.yml'
    - '{{ tmsetup_codedir }}/plate-recognizer/plate-recognizer.env'
    - '{{ tmsetup_codedir }}/frigate/frigate.env'
  ansible.builtin.stat:
    path: '{{ item }}'
    get_checksum: false
  register: tmsetup_entered_secrets_stat_register

- name: TMSetup - Update Stage - Check for Frigate's settings files
  become: true
  loop:
    - '{{ tmsetup_codedir }}/frigate/frigate.env'
    - '{{ tmsetup_codedir }}/frigate/config/config.yml'
  ansible.builtin.stat:
    path: '{{ item }}'
    get_checksum: false
  register: tmsetup_frigate_settings_stat_register

- name: TMSetup - Update Stage - Try the settings changes without making them
  block:
    - name: TMSetup - Update Stage - Try moving the entered secrets
      become: true
      when: tmsetup_entered_secrets_stat_register.results | selectattr('stat.exists') | list | length > 0
      environment:
        PYTHONDONTWRITEBYTECODE: '1'
        PYTHONPATH: '{{ tmsetup_update_backend_dir }}'
      ansible.builtin.command:
        argv: >-
          {{ [tmsetup_update_work_dir ~ '/check-venv/bin/python', '-m', 'tm_control', 'migrate', '--dry-run',
              '--secrets-dir', tmsetup_secrets_dir]
             + (['--node-red-config', tmsetup_codedir ~ '/node-red-tm/config/config.yml']
                if tmsetup_entered_secrets_stat_register.results[0].stat.exists else [])
             + (['--plate-recognizer-env', tmsetup_codedir ~ '/plate-recognizer/plate-recognizer.env']
                if tmsetup_entered_secrets_stat_register.results[1].stat.exists else [])
             + (['--frigate-env', tmsetup_codedir ~ '/frigate/frigate.env']
                if tmsetup_entered_secrets_stat_register.results[2].stat.exists else []) }}
      changed_when: false

    - name: TMSetup - Update Stage - Try updating Frigate's config
      become: true
      when: tmsetup_frigate_settings_stat_register.results[1].stat.exists
      environment:
        PYTHONDONTWRITEBYTECODE: '1'
        PYTHONPATH: '{{ tmsetup_update_backend_dir }}'
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - -u
          - '{{ tmsetup_codeowner }}'
          - --
          - '{{ tmsetup_update_work_dir }}/check-venv/bin/python'
          - -m
          - tm_control
          - migrate
          - --dry-run
          - --frigate-config
          - '{{ tmsetup_codedir }}/frigate/config/config.yml'
      changed_when: false
  rescue:
    - name: TMSetup - Update Stage - Refuse an update whose settings changes fail
      ansible.builtin.include_tasks: update_refuse.yml
      vars:
        tmsetup_update_reason: settings_need_attention

# What the build half and the caller read
- name: TMSetup - Update Stage - Write the facts file
  become: true
  ansible.builtin.template:
    dest: '{{ tmsetup_update_work_dir }}/facts.json'
    group: root
    mode: '0644'
    owner: root
    src: update/facts.json.j2
...
