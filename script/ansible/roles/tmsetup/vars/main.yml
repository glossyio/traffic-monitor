---
# TMSetup Variables (non-configurable)
tmsetup_tm_version: '0.7.1'
tmsetup_go2rtc_version: 'v1.9.14'
# sha256 of each go2rtc_linux_<arch> release asset; change these with tmsetup_go2rtc_version
tmsetup_go2rtc_sha256:
  amd64: '32d616af226bd731678ffde328b94cfb94e30339bfefc469cfb76323144615a6'
  arm64: '359fabade8a7a51e81a55fe6df6b0ef81764a5e1d63179577534eaaa71904b50'
tmsetup_frigate_version: '0.18.1'
tmsetup_node_red_tm_version: '5.0.8'
tmsetup_hailo_version: '4.21.0'
tmsetup_nginx_version: '1.31.0'
# Builds tm-control's UI in the revproxy image (container/revproxy/Containerfile.j2), with the Node release that
# tm-control/ui/package-lock.json was made with
tmsetup_node_image: docker.io/library/node:22.23.4-alpine
tmsetup_hailo_driver_repo: https://github.com/hailo-ai/hailort-drivers.git
tmsetup_hailo_driver_dir: "{{ tmsetup_codedir }}/tmp/hailort-drivers"
# udev symlink to the Pi 5 HEVC decoder (model rpi-hevc-dec); its /dev/media number changes between boots (#231).
# Must match the SYMLINK in templates/60-traffic-monitor-hevc-dec.rules.j2 and the device unit in frigate.container.j2.
tmsetup_hevc_device: /dev/rpi-hevc-dec
tmsetup_restart_required: false

tmsetup_remove_packages:
  - rpicam-apps-lite

tmsetup_packages:
  - aptitude
  - ca-certificates
  - host
  - screen
  - build-essential
  - cmake
  - git
  - cron
  - rpicam-apps
  - sysstat
  - python3-venv
  - polkitd

tmsetup_packages_backports:
  - cockpit
  - cockpit-files
  - cockpit-podman
  - cockpit-sosreport

tmsetup_base_required_facts:
  - os_family
  - distribution
  - distribution_major_version
  - distribution_version
  - distribution_release
  - architecture
  - user_id
  - user_dir
  - hostname

tmsetup_revproxy_image: localhost/revproxy:latest
# Config mounted into the revproxy container, relative to {{ tmsetup_codedir }}/revproxy.
# revproxy.container and the nginx -t check in revproxy_setup.yml both use this list.
tmsetup_revproxy_config_mounts:
  - { path: nginx.conf, target: /etc/nginx/nginx.conf }
  - { path: tm, target: /etc/nginx/tm }

# Reverse proxy location files, one per app plus tm-control's own (container/revproxy/tm/locations).
# Each app's file includes auth-viewer.conf or auth-admin.conf.
# Deployed location files not listed here are removed from the device.
tmsetup_revproxy_locations:
  - cockpit.conf
  - dashboard.conf
  - frigate.conf
  - go2rtc.conf
  - legacy-ui.conf
  - nodered.conf
  - storefiles.conf
  - tm-control-api.conf
  - tm-control-auth.conf
  - tm-control-ui.conf
# Files the location files include (container/revproxy/tm/snippets)
tmsetup_revproxy_snippets:
  - proxy-common.conf
  - auth-viewer.conf
  - auth-admin.conf

# Secrets generated once on the device by tasks/secrets.yml. Only names here; values never in the repo.
tmsetup_secrets_dir: /etc/traffic-monitor/secrets
tmsetup_secret_names:
  - go2rtc_rtsp_password
  - tm_control_session_key
  - frigate_proxy_secret
  - node_red_token_key
  - node_red_internal_token

# Install facts that only tmsetup writes: the secrets above, manifest.json, and the setup code while unclaimed
tmsetup_etc_dir: /etc/traffic-monitor

# tm-control code and venv: root-owned, outside tmsetup_codedir (which the code owner can write)
tmsetup_tm_control_dir: /usr/local/lib/traffic-monitor/tm-control
# tm-control's root job scripts, run by tm-job-<name>.service units; root-owned like the code
tmsetup_libexec_dir: /usr/local/libexec/traffic-monitor
# tm-control listens on loopback only; nginx proxies to it
tmsetup_tm_control_port: 8090
# What polkit lets tm-control's user (the code owner) do: these verbs on these units, and these actions (set the date,
# time, time zone, and NTP; reboot and power off, also while someone else is logged in), nothing else
tmsetup_tm_control_polkit:
  units:
    - traffic-monitor.service
    - frigate.service
    - node-red-tm.service
    - plate-recognizer.service
    - revproxy.service
    - go2rtc_server.service
    - tm-job-system-password.service
  unit_verbs:
    - start
    - stop
    - restart
  actions:
    - org.freedesktop.timedate1.set-time
    - org.freedesktop.timedate1.set-timezone
    - org.freedesktop.timedate1.set-ntp
    - org.freedesktop.login1.reboot
    - org.freedesktop.login1.reboot-multiple-sessions
    - org.freedesktop.login1.power-off
    - org.freedesktop.login1.power-off-multiple-sessions

# go2rtc RTSP user that Frigate logs in as; the password is tmsetup_secrets['go2rtc_rtsp_password']
tmsetup_go2rtc_rtsp_user: frigate

...
