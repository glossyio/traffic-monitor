---
# TMSetup Variables (non-configurable)
tmsetup_tm_version: '0.7.1'
tmsetup_go2rtc_version: 'v1.9.14'
# sha256 of each go2rtc_linux_<arch> release asset; change these with tmsetup_go2rtc_version
tmsetup_go2rtc_sha256:
  amd64: '32d616af226bd731678ffde328b94cfb94e30339bfefc469cfb76323144615a6'
  arm64: '359fabade8a7a51e81a55fe6df6b0ef81764a5e1d63179577534eaaa71904b50'
tmsetup_frigate_version: '0.18.2'
# The commit of the Raspberry Pi ffmpeg fork (jc-kynesim/rpi-ffmpeg) that the Frigate image builds, the head of its
# branch test/8.1.2/main on 2026-11-24. A branch moves; a commit doesn't. To update it, take the branch's new head
# with `git ls-remote https://github.com/jc-kynesim/rpi-ffmpeg.git refs/heads/test/8.1.2/main`.
tmsetup_frigate_ffmpeg_commit: 'f60aae17021abae85b1ba9759e8b2da33f723902'
# The open source yolov9 model the installer downloads for a Coral, in Frigate's model_cache. The installer's own
# model section names it, so tmsetup -f doesn't carry that section over (frigate_setup.yml).
tmsetup_frigate_coral_model_file: yolov9-s-relu6-tpumax_512_int8_edgetpu.tflite
# The release of dbro/frigate-detector-edgetpu-yolo9 that the model and its labels come from, and the SHA-256 of each
# file as taken on 2026-11-24. The tag is the same for both URLs. To update, change the tag and take both checksums
# from freshly downloaded files with `sha256sum`.
tmsetup_frigate_coral_model_release: v1.5
tmsetup_frigate_coral_model_sha256: 'f634f60259101556825fd69662f96282e74364b507f83e6382cc34d5d0e6170e'
tmsetup_frigate_coral_labels_sha256: '94758f79386e9122776f8fdca3583184d0ad7c94c7c87f661ae513fec45dd8d6'
# The model section Frigate's config gets on a device with a Coral; tm-control puts it back from the manifest.
tmsetup_frigate_coral_model:
  model_type: yolo-generic
  width: 512
  height: 512
  path: '/config/model_cache/{{ tmsetup_frigate_coral_model_file }}'
  labelmap_path: /config/labels-coco17.txt
tmsetup_node_red_tm_version: '5.0.10'
tmsetup_hailo_version: '4.21.0'
tmsetup_nginx_version: '1.31.0'
# Builds tm-control's UI in the revproxy image (container/revproxy/Containerfile.j2), with the Node release that
# tm-control/ui/package-lock.json was made with
tmsetup_node_image: docker.io/library/node:22.23.4-alpine
# The digest of each base image the builds start from (the Containerfiles' FROM lines), as the registry served it on
# 2026-11-25. Each is the registry's digest for the tag, the multi-arch list's for a tag that has one, and it changes
# together with the version above it (debian's tag has no version here, so it changes by hand). The check in
# script/tests that asks the registries tells when one stops resolving.
tmsetup_debian_image_digest: 'sha256:e67eeead736ff7bbe258ef088bff683635c561b1fcfefad0806c1df4ab49ce0e'
tmsetup_frigate_image_digest: 'sha256:fd60f99ffd4eb6c42360ed4e14953e270586f239309ab3983e55b2e97ffac09a'
tmsetup_node_red_tm_image_digest: 'sha256:3622786c15b6f57f61bf1d0ece59d06a18b742c5c8955f588d189b6bee8dc97d'
tmsetup_node_image_digest: 'sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202'
tmsetup_nginx_image_digest: 'sha256:800e7c98538c6bf725f5177e841aa720ae0ed1c378bbea368b6330bfe18a36b3'
tmsetup_hailo_driver_repo: https://github.com/hailo-ai/hailort-drivers.git
tmsetup_hailo_driver_dir: "{{ tmsetup_codedir }}/tmp/hailort-drivers"
# udev symlink to the Pi 5 HEVC decoder (model rpi-hevc-dec); its /dev/media number changes between boots (#231).
# Must match the SYMLINK in templates/60-traffic-monitor-hevc-dec.rules.j2 and the device unit in frigate.container.j2.
tmsetup_hevc_device: /dev/rpi-hevc-dec
# A harmless Podman command the image build units run first (ExecStartPre=-). After an unclean shutdown the boot's
# first Podman command clears the lost boot's containers, and Podman 5.4.2 can crash while it does (#268; fixed in
# Podman 5.6.0). This command takes that crash instead of the build.
tmsetup_podman_refresh_command: /usr/bin/podman network exists podman
tmsetup_restart_required: false

tmsetup_remove_packages:
  - rpicam-apps-lite

tmsetup_packages:
  - aptitude
  - ca-certificates
  - host
  - screen
  - build-essential
  - cmake
  - git
  - cron
  - rpicam-apps
  - sysstat
  - python3-venv
  - polkitd

tmsetup_packages_backports:
  - cockpit
  - cockpit-files
  - cockpit-podman
  - cockpit-sosreport

tmsetup_base_required_facts:
  - os_family
  - distribution
  - distribution_major_version
  - distribution_version
  - distribution_release
  - architecture
  - user_id
  - user_dir
  - hostname

tmsetup_revproxy_image: localhost/revproxy:latest
# Config mounted into the revproxy container, relative to {{ tmsetup_codedir }}/revproxy.
# revproxy.container and the nginx -t check in revproxy_setup.yml both use this list.
tmsetup_revproxy_config_mounts:
  - { path: nginx.conf, target: /etc/nginx/nginx.conf }
  - { path: tm, target: /etc/nginx/tm }

# Reverse proxy location files, one per app plus tm-control's own (container/revproxy/tm/locations).
# Each app's file includes auth-viewer.conf or auth-admin.conf.
# Deployed location files not listed here are removed from the device.
tmsetup_revproxy_locations:
  - dashboard.conf
  - frigate.conf
  - go2rtc.conf
  - legacy-ui.conf
  - nodered.conf
  - storefiles.conf
  - tm-control-api.conf
  - tm-control-auth.conf
  - tm-control-ui.conf
# Files the location files include (container/revproxy/tm/snippets)
tmsetup_revproxy_snippets:
  - proxy-common.conf
  - auth-viewer.conf
  - auth-admin.conf
  - home-button.conf

# Secrets generated once on the device by tasks/secrets.yml. Only names here; values never in the repo.
tmsetup_secrets_dir: /etc/traffic-monitor/secrets
tmsetup_secret_names:
  - go2rtc_rtsp_password
  - tm_control_session_key
  - frigate_proxy_secret
  - node_red_token_key
  - node_red_internal_token
# Secrets a person types in (on the control app's Device page); tmsetup creates each file empty and never fills it.
# An empty file means "not set".
tmsetup_entered_secret_names:
  - thingsboard_access_token
  - frigate_plus_api_key
  - plate_recognizer_token
  - plate_recognizer_license_key

# Install facts that only tmsetup writes: the secrets above, manifest.json, and the setup code while unclaimed
tmsetup_etc_dir: /etc/traffic-monitor

# tm-control code and venv: root-owned, outside tmsetup_codedir (which the code owner can write)
tmsetup_tm_control_dir: /usr/local/lib/traffic-monitor/tm-control
# tm-control's root job scripts, run by tm-job-<name>.service units; root-owned like the code
tmsetup_libexec_dir: /usr/local/libexec/traffic-monitor
# tm-control listens on loopback only; nginx proxies to it
tmsetup_tm_control_port: 8090
# What polkit lets tm-control's user (the code owner) do: these verbs on these units, and these actions (set the date,
# time, time zone, and NTP; reboot and power off, also while someone else is logged in), nothing else
tmsetup_tm_control_polkit:
  units:
    - traffic-monitor.service
    - frigate.service
    - node-red-tm.service
    - plate-recognizer.service
    - revproxy.service
    - go2rtc_server.service
    - tm-job-system-password.service
    - tm-job-set-secret.service
    - tm-job-network.service
    - tm-job-network-join.service
    - tm-network-retry.service
  unit_verbs:
    - start
    - stop
    - restart
  actions:
    - org.freedesktop.timedate1.set-time
    - org.freedesktop.timedate1.set-timezone
    - org.freedesktop.timedate1.set-ntp
    - org.freedesktop.login1.reboot
    - org.freedesktop.login1.reboot-multiple-sessions
    - org.freedesktop.login1.power-off
    - org.freedesktop.login1.power-off-multiple-sessions

# go2rtc RTSP user that Frigate logs in as; the password is tmsetup_secrets['go2rtc_rtsp_password']
tmsetup_go2rtc_rtsp_user: frigate

# The hotspot (tasks/wifi_setup.yml): the built-in radio it runs on, its NetworkManager profile, and its fixed
# address. nginx's sign-in rule, the firewall table, and tm-control's manifest read the same values.
tmsetup_wifi_device: wlan0
tmsetup_hotspot_profile: tm-hotspot
tmsetup_hotspot_address: 10.42.0.1
tmsetup_hotspot_subnet: 10.42.0.0/24
tmsetup_wifi_packages:
  - iw
  - nftables
  - dnsmasq-base

# The Sharing page (tm-control's manifest records both): the maintainer's ThingsBoard server, which is the default
# upload host, and whether the public map choice is live yet. Turn the second on in the release that opens the map.
tmsetup_sharing_maintainer_host: 'tb.roadwaybiome.com'
tmsetup_sharing_public_map_live: false

# The Location page's map (tm-control's manifest records it). A browser fetches it, only after an admin presses a map
# button; the device never does. An empty value turns the map off.
tmsetup_map_style_url: 'https://tiles.openfreemap.org/styles/liberty'

...
